<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-amber-100">
    <main class="flex flex-col justify-center items-center bg-amber-100 min-h">
      <h1 class="text-3xl pt-32 text-amber-600 p-8 text-center">Taste the world:Choose a Country
      </h1>
      <p>Where would your tastebuds travel today?</p>
      <div class="input-wrapper flex items-stretch gap-2">
       <input
        type="text"
      class="input outline-2 outline-amber-400 rounded-xl px-4 py-3 flex-1"
     placeholder="search for a country"
     />
     <button
     class="btn bg-amber-600 px-6 rounded-xl text-white"
     >
     Search
     </button>
     </div>
      <div class="container"></div>
    </main>

    <script src="main.js"></script>
  </body>
</html>
